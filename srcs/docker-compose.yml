version: '3'

services:
  mariadb:
    image: mariadb:inception_hasserao_v1
    container_name: mariadb
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - inception
    # expose:
    #   - 3306 
    restart: on-failure



  wordpress:
    image: wordpress:inception_hasserao_v1
    container_name: wordpress
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception
    # expose:
    #   - 9000
    depends_on:
      - mariadb
    restart: on-failure
  



  nginx:
    image: nginx:inception_hasserao_v1
    container_name: nginx
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - wordpress:/var/www/html
    ports:
      - "443:443"
    depends_on:
      - wordpress
    networks:
      - inception
    restart: on-failure

volumes:

  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: $WORDPRESS_VOL
  mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: $DB_VOL



networks:
  inception:
    driver: bridge
